openapi: 3.0.3
info:
  title: XingShe API
  version: 0.1.0
paths:
  /api/v1/auth/email-code:
    post:
      operationId: sendEmailVerificationCode
      summary: Send an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '200':
          description: Code accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Code requested too frequently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginWithEmailCode
      summary: Log in with an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid, expired, or malformed code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated session tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EmailCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    LoginRequest:
      type: object
      required: [email, code, device_id]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          pattern: '^\d{6}$'
        device_id:
          type: string
          maxLength: 128
    RefreshRequest:
      type: object
      required: [refresh_token, device_id]
      properties:
        refresh_token:
          type: string
          maxLength: 512
        device_id:
          type: string
          maxLength: 128
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 512
    User:
      type: object
      required: [id, email, nickname, avatar_url]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
    TokenData:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          example: 7200
    LoginData:
      allOf:
        - $ref: '#/components/schemas/TokenData'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    SuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          type: object
    LoginResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/LoginData'
    TokenResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/TokenData'
    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, AUTH_CODE_INVALID, AUTH_CODE_EXPIRED, AUTH_CODE_TOO_FREQUENT, AUTH_INVALID_TOKEN, AUTH_UNAUTHORIZED, INTERNAL_ERROR, RATE_LIMITED]
        message:
          type: string
        data:
          type: object
          nullable: true
