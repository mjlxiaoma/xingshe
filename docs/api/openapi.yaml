openapi: 3.0.3
info:
  title: XingShe API
  version: 0.1.0
paths:
  /api/v1/auth/email-code:
    post:
      operationId: sendEmailVerificationCode
      summary: Send an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '200':
          description: Code accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Code requested too frequently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginWithEmailCode
      summary: Log in with an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid, expired, or malformed code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated session tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateCurrentUser
      summary: Update the current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid nickname
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/spots:
    get:
      operationId: listShootingSpots
      summary: List shooting spots
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radius
          in: query
          description: Search radius in meters; requires latitude and longitude
          schema:
            type: number
            exclusiveMinimum: true
            minimum: 0
            maximum: 500000
            default: 50000
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 128
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged shooting spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/spots/{spotId}:
    get:
      operationId: getShootingSpot
      summary: Get a shooting spot
      parameters:
        - name: spotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shooting spot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotResponse'
        '400':
          description: Invalid spot ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shooting spot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/spots/{spotId}/favorite:
    parameters:
      - name: spotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: favoriteShootingSpot
      summary: Favorite a shooting spot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Spot favorited or already favorited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shooting spot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: unfavoriteShootingSpot
      summary: Remove a shooting spot favorite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Favorite removed or already absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/favorite-spots:
    get:
      operationId: listFavoriteShootingSpots
      summary: List the current user's favorite shooting spots
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Favorite shooting spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteSpotListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EmailCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    LoginRequest:
      type: object
      required: [email, code, device_id]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          pattern: '^\d{6}$'
        device_id:
          type: string
          maxLength: 128
    RefreshRequest:
      type: object
      required: [refresh_token, device_id]
      properties:
        refresh_token:
          type: string
          maxLength: 512
        device_id:
          type: string
          maxLength: 128
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 512
    User:
      type: object
      required: [id, email, nickname, avatar_url]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
    UpdateUserRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 64
    ShootingSpot:
      type: object
      required: [id, name, description, latitude, longitude, coordinate_system, address, cover_url, best_time, tags, is_favorited]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        coordinate_system:
          type: string
          enum: [GCJ02, WGS84]
        address:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        best_time:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        is_favorited:
          type: boolean
        distance_meters:
          type: number
          format: double
          nullable: true
    SpotList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShootingSpot'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
    FavoriteSpotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShootingSpot'
    TokenData:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          example: 7200
    LoginData:
      allOf:
        - $ref: '#/components/schemas/TokenData'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    SuccessResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          type: object
    LoginResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/LoginData'
    TokenResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/TokenData'
    UserResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/User'
    SpotListResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/SpotList'
    SpotResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/ShootingSpot'
    FavoriteSpotListResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/FavoriteSpotList'
    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, AUTH_CODE_INVALID, AUTH_CODE_EXPIRED, AUTH_CODE_TOO_FREQUENT, AUTH_INVALID_TOKEN, AUTH_UNAUTHORIZED, INTERNAL_ERROR, RATE_LIMITED]
        message:
          type: string
        data:
          type: object
          nullable: true
